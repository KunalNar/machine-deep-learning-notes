<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Rate Dynamics (Slides 5–7)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 8px;
    }
    .widget-card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 14px;
      max-width: 820px;
      margin: 0 auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .tabs {
      display: flex;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      background: #0284c7;
      color: #fff;
    }
    .tab-btn.danger.active {
      background: #dc2626;
      color: #fff;
    }
    .tab-btn.opt.active {
      background: #059669;
      color: #fff;
    }
    .content-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 680px) {
      .content-layout { grid-template-columns: 1fr; }
    }
    canvas {
      background: #080c14;
      border: 1px solid #1f2937;
      border-radius: 8px;
      width: 100%;
      height: 250px;
      cursor: crosshair;
    }
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .metric-box {
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 6px 8px;
      text-align: center;
    }
    .metric-lbl {
      font-size: 9px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }
    .metric-val {
      font-size: 12px;
      font-weight: 700;
      font-family: monospace;
      color: #38bdf8;
      margin-top: 2px;
    }
    .controls-box {
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .slider-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .slider-head span:last-child {
      color: #38bdf8;
      font-family: monospace;
    }
    input[type=range] {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 2px;
      outline: none;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-blue { background: #0284c7; color: #fff; }
    .btn-gray { background: #1e293b; color: #cbd5e1; border-color: #374151; }
    .info-card {
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.4;
      color: #cbd5e1;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="widget-card">
  <div class="top-bar">
    <div style="font-size: 13px; font-weight: 700; color: #f8fafc;">
      Learning Rate Dynamics <span style="font-size: 10px; background: rgba(56,189,248,0.2); color: #38bdf8; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">Slides 5–7</span>
    </div>
    <div class="tabs">
      <button class="tab-btn danger" id="t1" onclick="setMode('take1')">Take 1: Too High</button>
      <button class="tab-btn" id="t2" onclick="setMode('take2')">Take 2: Too Low</button>
      <button class="tab-btn" id="t3" onclick="setMode('take3')">Take 3: Noise</button>
      <button class="tab-btn opt active" id="t4" onclick="setMode('decay')">Take 3: Decay</button>
    </div>
  </div>

  <div class="metrics-row">
    <div class="metric-box">
      <div class="metric-lbl">Status</div>
      <div class="metric-val" id="mStatus" style="font-size: 11px;">Running</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">Step (t)</div>
      <div class="metric-val" id="mStep">0</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">Loss J(θ)</div>
      <div class="metric-val" id="mLoss">0.000</div>
    </div>
    <div class="metric-box">
      <div class="metric-lbl">LR (ε_t)</div>
      <div class="metric-val" id="mLr">0.450</div>
    </div>
  </div>

  <div class="content-layout">
    <div>
      <canvas id="cv" width="380" height="250"></canvas>
      <div style="display: flex; justify-content: space-between; font-size: 9.5px; color: #64748b; margin-top: 4px; padding: 0 2px;">
        <span>Ellipses: Contours (Center = 0,0)</span>
        <span>Click canvas to place initial weights</span>
      </div>
    </div>

    <div>
      <div class="controls-box">
        <div class="slider-row">
          <div class="slider-head">
            <span>Base LR (ε)</span>
            <span id="lblLr">0.45</span>
          </div>
          <input type="range" id="sLr" min="0.01" max="1.15" step="0.01" value="0.45" oninput="onSlide()">
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <span>Noise (σ)</span>
            <span id="lblNoise">0.30</span>
          </div>
          <input type="range" id="sNoise" min="0.0" max="0.8" step="0.05" value="0.30" oninput="onSlide()">
        </div>

        <div class="slider-row">
          <div class="slider-head">
            <span>Decay Rate (α)</span>
            <span id="lblDecay">0.040</span>
          </div>
          <input type="range" id="sDecay" min="0.0" max="0.10" step="0.005" value="0.040" oninput="onSlide()">
        </div>

        <div class="btn-row">
          <button class="btn btn-blue" id="btnPlay" onclick="togglePlay()">Pause</button>
          <button class="btn btn-gray" onclick="step()">+1 Step</button>
          <button class="btn btn-gray" onclick="reset()">Reset</button>
        </div>
      </div>

      <div class="info-card" id="infoText">
        <!-- Injected -->
      </div>
    </div>
  </div>
</div>

<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const C1 = 0.15, C2 = 1.90;
  const SX = cv.width / 9, SY = cv.height / 6.5;
  const OX = cv.width / 2, OY = cv.height / 2;

  function toScreen(th1, th2) {
    return { x: OX + th1 * SX, y: OY - th2 * SY };
  }
  function toParam(x, y) {
    return { th1: (x - OX) / SX, th2: (OY - y) / SY };
  }

  let trajectory = [];
  let theta = { th1: -3.8, th2: 2.5 };
  let baseLR = 0.45, noise = 0.30, decay = 0.040;
  let isRunning = true, isDiverged = false, mode = 'decay';

  const modes = {
    take1: {
      lr: 1.08, noise: 0.0, decay: 0.0, start: { th1: -3.8, th2: 1.4 },
      title: "Slide 5: LR Too High",
      desc: "<b style='color:#f87171;'>Overshoots & Diverges:</b> When ε > 2 / λ_max (≈ 1.05), updates bounce across steep walls with exponentially growing amplitude until exploding to NaN."
    },
    take2: {
      lr: 0.035, noise: 0.0, decay: 0.0, start: { th1: -3.8, th2: 2.5 },
      title: "Slide 6: LR Too Low",
      desc: "<b style='color:#fbbf24;'>Crawls Slowly:</b> Stable, but horizontal steps along the valley floor are microscopic. Takes thousands of steps to reach the optimum."
    },
    take3: {
      lr: 0.45, noise: 0.35, decay: 0.0, start: { th1: -3.8, th2: 2.5 },
      title: "Slide 7: Good LR with Noise",
      desc: "<b style='color:#38bdf8;'>Jitters Near Minimum:</b> Swiftly reaches the center, but mini-batch sampling noise keeps the parameters jittering in a random orbit around the minimum."
    },
    decay: {
      lr: 0.48, noise: 0.35, decay: 0.040, start: { th1: -3.8, th2: 2.5 },
      title: "Slide 7 Solution: LR Decay",
      desc: "<b style='color:#34d399;'>Optimal Convergence:</b> Decaying the learning rate (ε_t = ε_0 / (1 + αt)) shrinks steps over time, damping mini-batch noise and freezing tightly at (0,0)!"
    }
  };

  function setMode(m) {
    mode = m;
    ['t1', 't2', 't3', 't4'].forEach(id => document.getElementById(id).classList.remove('active'));
    if (m === 'take1') document.getElementById('t1').classList.add('active');
    if (m === 'take2') document.getElementById('t2').classList.add('active');
    if (m === 'take3') document.getElementById('t3').classList.add('active');
    if (m === 'decay') document.getElementById('t4').classList.add('active');

    const cfg = modes[m];
    baseLR = cfg.lr; noise = cfg.noise; decay = cfg.decay;
    theta = { ...cfg.start };

    document.getElementById('sLr').value = baseLR;
    document.getElementById('sNoise').value = noise;
    document.getElementById('sDecay').value = decay;
    updateLabels();
    reset();
  }

  function onSlide() {
    baseLR = parseFloat(document.getElementById('sLr').value);
    noise = parseFloat(document.getElementById('sNoise').value);
    decay = parseFloat(document.getElementById('sDecay').value);
    updateLabels();
  }

  function updateLabels() {
    document.getElementById('lblLr').innerText = baseLR.toFixed(2);
    document.getElementById('lblNoise').innerText = noise.toFixed(2);
    document.getElementById('lblDecay').innerText = decay.toFixed(3);
  }

  function reset() {
    const cfg = modes[mode];
    theta = { ...cfg.start };
    trajectory = [{ ...theta }];
    isDiverged = false;
    document.getElementById('infoText').innerHTML = `<div style="font-weight:700; color:#fff; margin-bottom:3px;">${cfg.title}</div><div>${cfg.desc}</div>`;
    updateUI();
    draw();
  }

  function togglePlay() {
    isRunning = !isRunning;
    document.getElementById('btnPlay').innerText = isRunning ? 'Pause' : 'Play';
  }

  cv.addEventListener('mousedown', (e) => {
    const r = cv.getBoundingClientRect();
    const p = toParam(e.clientX - r.left, e.clientY - r.top);
    theta = { th1: p.th1, th2: p.th2 };
    trajectory = [{ ...theta }];
    isDiverged = false;
    updateUI();
    draw();
  });

  function step() {
    if (isDiverged) return;
    const t = trajectory.length;
    const effLR = baseLR / (1 + decay * t);

    const g1 = C1 * theta.th1;
    const g2 = C2 * theta.th2;

    let n1 = 0, n2 = 0;
    if (noise > 0) {
      const u1 = Math.max(1e-7, Math.random());
      const u2 = Math.random();
      n1 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2) * noise;
      n2 = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2) * noise;
    }

    const nTh1 = theta.th1 - effLR * (g1 + n1);
    const nTh2 = theta.th2 - effLR * (g2 + n2);

    theta = { th1: nTh1, th2: nTh2 };
    trajectory.push({ ...theta });

    if (Math.abs(nTh1) > 7 || Math.abs(nTh2) > 5 || isNaN(nTh1) || isNaN(nTh2)) {
      isDiverged = true;
    }

    updateUI();
    draw();
  }

  function updateUI() {
    const t = trajectory.length - 1;
    const effLR = baseLR / (1 + decay * t);
    const loss = 0.5 * (C1 * theta.th1 * theta.th1 + C2 * theta.th2 * theta.th2);

    document.getElementById('mStep').innerText = t;
    document.getElementById('mLoss').innerText = isDiverged ? "NaN" : loss.toFixed(3);
    document.getElementById('mLr').innerText = effLR.toFixed(3);

    const st = document.getElementById('mStatus');
    if (isDiverged) {
      st.innerText = "Diverged!";
      st.style.color = "#f87171";
    } else if (loss < 0.008 && t > 40) {
      st.innerText = "Converged";
      st.style.color = "#34d399";
    } else if (baseLR < 0.06) {
      st.innerText = "Crawling";
      st.style.color = "#fbbf24";
    } else {
      st.innerText = "Running";
      st.style.color = "#38bdf8";
    }
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);

    // Axes
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, OY); ctx.lineTo(cv.width, OY);
    ctx.moveTo(OX, 0); ctx.lineTo(OX, cv.height);
    ctx.stroke();

    // Contours
    [0.1, 0.4, 1.0, 2.2, 4.0, 7.0].forEach(J => {
      const a = Math.sqrt((2 * J) / C1) * SX;
      const b = Math.sqrt((2 * J) / C2) * SY;
      ctx.beginPath();
      ctx.ellipse(OX, OY, a, b, 0, 0, 2 * Math.PI);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.18)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    // Optimum (0, 0)
    ctx.fillStyle = '#34d399';
    ctx.beginPath();
    ctx.arc(OX, OY, 4, 0, 2 * Math.PI);
    ctx.fill();

    // Trajectory
    if (trajectory.length > 1) {
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      const p0 = toScreen(trajectory[0].th1, trajectory[0].th2);
      ctx.moveTo(p0.x, p0.y);
      for (let i = 1; i < trajectory.length; i++) {
        const p = toScreen(trajectory[i].th1, trajectory[i].th2);
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    // Dots
    trajectory.forEach((pt, i) => {
      const p = toScreen(pt.th1, pt.th2);
      if (p.x < -10 || p.x > cv.width + 10 || p.y < -10 || p.y > cv.height + 10) return;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (i === trajectory.length - 1) ? 4.5 : 2.5, 0, 2 * Math.PI);
      ctx.fillStyle = (i === trajectory.length - 1) ? '#38bdf8' : '#ef4444';
      ctx.fill();
    });

    if (isDiverged) {
      ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#f87171';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('DIVERGED: LR Too High!', cv.width / 2, cv.height / 2);
      ctx.textAlign = 'left';
    }
  }

  let lastT = 0;
  function loop(t) {
    if (isRunning && !isDiverged) {
      if (t - lastT > 80) {
        step();
        lastT = t;
      }
    }
    requestAnimationFrame(loop);
  }

  setMode('decay');
  requestAnimationFrame(loop);
</script>

</body>
</html>
